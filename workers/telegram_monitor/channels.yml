# ============ ВЫБРОШЕНО И ПОЧЕМУ ============
#
# МЁРТВЫЕ (превью пустое - переименованы, закрыты или удалены).
# Именно они ломали резолв: fordev, mobile_jobs, myjobit, jobs_it,
# jobGeeks, tprogers, distantsiya, designer_jobs, TargetContext,
# edmarketclubjob, novobranez, bina_Znaet, profiwork.
#
# ЖИВЫЕ, НО БЕЗ ЕДИНОГО ЗАКАЗА - чистые каналы вакансий в штат,
# matcher.py выбросит из них всё: pydevjob (0/6), geekjobs (0/2),
# jobforjunior (0/6), jobfortm (0/4), Relocats (0/1), fordesigner (0/5),
# theblueprintcareer (0/13), zapwork (0/3), edujobs (0/2), workinart (0/4),
# theyseeku (0/2), naudalenkebro (0/2), Remoteit (0/0), OnlyDGTL (0/0),
# ru_pythonjobs, kazjob, ipomogator, THE_POMOGATOR, workzavr, remote_ru,
# jobs_designglory, promopoisk.
#
# НЕ НАША НИША - живые, заказы есть, но это копирайтинг, SMM и таргет,
# которые студия не продаёт: textmoney, Work4writers, work_editor,
# textodromo, glvrd_job, ttargetjob, smmlancer, smm_leads, seohr,
# dnative_job, marketing_jobs, vacancysmm, tolokaSeek, perezvonyu.
#
# HR-КАНАЛЫ И СТАЖИРОВКИ - поток идёт от работодателей:
# HRity, hireproproduct, jun_hi_vacancies, noexperience, stage_1st,
# InclusiveVacancy, jobpower, frilancekomfort, distantsiya2, jsdevjob,
# jvmjobs, Getitrussia, kadrof_work, jobkz_1, workk_on, designer_ru,
# freelancetaverna, vdhl_good, workk_on.
