# channels.yml - каналы для мониторинга order-постов.
#
# Собран из измерений, а не из подборок. Каждый канал проверен через
# t.me/s/ (verify_channels.py): числа в комментариях - это сколько из
# последних постов выглядят как ЗАКАЗ и сколько как ВАКАНСИЯ.
# Формат комментария: # заказы/вакансии из N постов.
#
# Предыдущая версия на 98 каналов лежит в channels_old_98.yml.bak.
# Из тех 98: 13 мертвы, 22 живы но заказов не содержат вообще,
# 55 смешанные, и только 8 дали заказов больше, чем вакансий.
# Именно резолв мёртвых хендлов через Telethon и вызвал FloodWait.
#
# ПОЧЕМУ СПИСОК КОРОТКИЙ. Большинство "фриланс-каналов" на деле каналы
# вакансий: их монетизируют HR, а не заказчики. matcher.py такие посты
# выбрасывает, поэтому канал без заказов стоит запросов и не даёт ничего.
# Длина списка здесь не достоинство, а риск.
#
# priority: 1 = заказы подтверждены, заказов больше вакансий
#           2 = смешанный, но заказов много и ниша наша
#           3 = смешанный, отдача ниже - включать после priority 1-2
#
# ПОДПИСКА. Не подписываться на всё разом - это снова FloodWait.
# Партиями по 5-7 в день, начиная с priority 1. Резолв 10 хендлов
# безопасен, 98 - нет.
#
# ПЕРЕПРОВЕРКА. Каналы умирают и переименовываются. Раз в пару месяцев:
#   python -m workers.telegram_monitor.verify_channels --out verified.yml
# Telegram API при этом не задействуется вообще.

channels:

  # ============ PRIORITY 1 - заказы подтверждены измерением ============

  # Хабр Фриланс. Лучший канал списка: ВСЕ 20 последних постов - заказы.
  # Разработка сайтов, боты, парсеры, интеграции БД, с ценами за проект.
  - {username: freelansim_ru,  title: "Хабр Фриланс",                priority: 1, category: dev_orders}   # 20/0 из 20

  # Заказы с прописанным ТЗ, сроком и бюджетом (200-350 тыс. руб.
  # в ленте на момент проверки). Веб- и мобильная разработка.
  - {username: zerocode_jobs,  title: "Запили мне, зерокодер",       priority: 1, category: dev_orders}   # найден отдельно

  # Заказы на дизайн. Заказчики публикуются бесплатно через
  # @Zakaz_Design_Bot - поток идёт от клиентов, а не от HR.
  - {username: zakaz_design,   title: "ЗАКАЗЫ НА ДИЗАЙН",            priority: 1, category: design_orders} # найден отдельно

  - {username: webfrl,         title: "Web Freelance",               priority: 1, category: dev_web}      # 9/8 из 20
  - {username: digitaltender,  title: "DIGITAL Tender",              priority: 1, category: digital_orders} # 8/4 из 20
  - {username: workindesign,   title: "Work in Design",              priority: 1, category: design_orders} # 5/4 из 10
  - {username: it_vac,         title: "IT Jobs | Вакансии, Фриланс", priority: 1, category: it_orders}    # 2/0 из 20
  - {username: jc_it,          title: "Jobs Code: IT",               priority: 1, category: it_orders}    # 1/0 из 5

  # ============ PRIORITY 2 - смешанные, заказов много, ниша наша ======

  - {username: Visionisland,   title: "Vision Island",               priority: 2, category: design_orders} # 19/19 из 20
  - {username: surovowork,     title: "Суровый фриланс",             priority: 2, category: general_orders} # 12/12 из 20
  - {username: vacanciesrus,   title: "Вакансии digital",            priority: 2, category: digital_orders} # 12/12 из 20
  - {username: normrabota,     title: "Норм работа",                 priority: 2, category: general_orders} # 8/11 из 20
  - {username: designwork_vacansii, title: "Design Work",            priority: 2, category: design_orders} # 7/8 из 19
  - {username: design_vacancy, title: "Design Vacancy",              priority: 2, category: design_orders} # 7/8 из 20
  - {username: motionhunter,   title: "Motion Hunter (motion/3D)",   priority: 2, category: motion_3d}    # 7/7 из 19
  - {username: rueventjob,     title: "Удалёнка - творческая работа", priority: 2, category: digital_orders} # 6/10 из 21
  - {username: workasap,       title: "Workasap",                    priority: 2, category: digital_orders} # 5/9 из 20
  - {username: design_careers, title: "Design Careers",              priority: 2, category: design_orders} # 4/4 из 18
