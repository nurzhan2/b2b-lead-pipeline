# Keyword dictionary used by matcher.py to decide whether a post is an
# order request - and, just as importantly, whether it's actually a
# hiring/vacancy post in disguise. All five sections are plain YAML lists
# (intent/domain/budget also carry a weight, used only for priority
# scoring, not for the accept/reject decision) - add/remove keywords
# freely, no code changes needed. Matching is case-insensitive,
# whole-word/phrase, on whitespace-collapsed text.
#
# Словарь собран по услугам двух сайтов студии:
#   qorsa.ru      - веб- и графический дизайн, сайты, интернет-магазины,
#                   мобильные приложения
#   malevich2.com - AI-ассистенты, RAG, чат-боты, автоматизация
#                   бизнес-процессов, Tilda/WordPress/Битрикс, Bitrix24,
#                   1С, личные кабинеты, внутренние системы, UX/UI,
#                   фирменный стиль, SEO, техподдержка
#
# Если услуга не в этом списке - ключа здесь быть не должно. Лид, который
# некому выполнить, хуже отсутствия лида: он съедает время на разбор.

intent:
  # Direct signals that someone is placing/looking for an order right now.
  weight: 3
  keywords:
    - "нужен сайт"
    - "нужен интернет-магазин"
    - "нужен лендинг"
    - "нужно приложение"
    - "нужен личный кабинет"
    - "нужен бот"
    - "нужен телеграм бот"
    - "нужен чат-бот"
    - "нужна интеграция"
    - "нужна автоматизация"
    - "нужна crm"
    - "нужен дизайн"
    - "нужен логотип"
    - "нужен фирменный стиль"
    - "ищу разработчика"
    - "ищу веб-студию"
    - "ищу подрядчика"
    - "ищу дизайнера"
    - "ищу команду"
    - "кто делает сайты"
    - "кто делает ботов"
    - "разработка под ключ"
    - "требуется бот"
    - "требуется сайт"
    - "нужен дизайн интерьера"
    - "нужна визуализация"
    - "нужен дизайн-проект"
    - "ищу дизайнера интерьера"
    - "ищу визуализатора"

domain:
  # Topic words. Alone, these are just chatter - matcher.py only counts
  # them as a lead when paired with an order signal.
  weight: 2
  keywords:
    # сайты и веб
    - "сайт"
    - "лендинг"
    - "интернет-магазин"
    - "многостраничник"
    - "корпоративный сайт"
    - "личный кабинет"
    - "веб-приложение"
    - "тильда"
    - "tilda"
    - "wordpress"
    - "битрикс"
    - "bitrix"
    - "1с-битрикс"
    # приложения
    - "приложение"
    - "мобильное приложение"
    - "ios"
    - "android"
    # боты и AI
    - "бот"
    - "телеграм бот"
    - "чат-бот"
    - "нейросеть"
    - "ии"
    - "ai"
    - "gpt"
    - "llm"
    - "rag"
    - "ai-ассистент"
    - "ассистент"
    # автоматизация, CRM, интеграции
    - "автоматизация"
    - "интеграция"
    - "crm"
    - "amocrm"
    - "bitrix24"
    - "битрикс24"
    - "1с"
    - "api"
    - "парсер"
    - "выгрузка"
    # дизайн
    - "дизайн"
    - "ux"
    - "ui"
    - "ux/ui"
    - "фирменный стиль"
    - "логотип"
    - "брендинг"
    - "макет"
    - "figma"
    - "фигма"
    # продвижение и поддержка
    - "seo"
    - "продвижение"
    - "техподдержка"
    - "поддержка сайта"
    # интерьер, среда, 3D - студия делает это наравне с digital
    - "интерьер"
    - "дизайн интерьера"
    - "дизайн-проект"
    - "планировка"
    - "визуализация"
    - "3d"
    - "3д"
    - "рендер"
    - "экстерьер"
    - "вывеска"
    - "ландшафт"
    - "благоустройство"

budget:
  # Budget markers. Also sets budget_flag=true, which the core scores
  # directly via raw.budgetMentioned (+20, see core README). Separate from
  # order_signals below - this one only feeds scoring, not the
  # accept/reject decision (though the two lists naturally overlap).
  weight: 1
  keywords:
    - "бюджет"
    - "оплата"
    - "тз"
    - "прайс"
    - "стоимость"
    - "смета"
    - "вилка"

# Markers of a HIRING/VACANCY post ("in-house", not a one-off order). A
# post that matched (intent, or domain+order_signals) gets REJECTED if one
# of these fires and NOT ONE order_signals keyword also fires - see
# matcher.py. The two channel types (job boards vs. freelance/order
# boards) use overlapping language, so this is what tells them apart.
#
# Этот список несёт основную нагрузку: из 98 проверенных каналов 22 живых
# оказались чистыми каналами вакансий, а ещё 55 смешанными. Чем точнее
# здесь, тем больше смешанных каналов можно вернуть в мониторинг.
anti_hiring:
  - "в команду"
  - "в штат"
  - "в нашу компанию"
  - "в нашу студию"
  - "в наше агентство"
  - "оклад"
  - "заработная плата"
  - "з/п от"
  - "зарплата от"
  - "график работы"
  - "график 5/2"
  - "полный рабочий день"
  - "оформление по тк"
  - "тк рф"
  - "трудоустройство"
  - "испытательный срок"
  - "соцпакет"
  - "дмс"
  - "требуется сотрудник"
  - "ищем сотрудника"
  - "на постоянную основу"
  - "релокация"
  - "вакансия"
  - "вакансия открыта"
  - "мы ищем"
  - "штатный"
  - "fulltime"
  - "full-time"
  - "part-time"
  - "удаленный сотрудник"
  - "присылайте резюме"
  - "ждём резюме"
  - "собеседование"
  - "тестовое задание"
  - "стажировка"
  - "наставник"
  - "команда растёт"

# Markers of a ONE-OFF ORDER. Presence of any of these outweighs
# anti_hiring (see matcher.py) - a post mentioning both "в штат" AND "разовая
# задача" is far more likely a poorly-worded order than a vacancy, so order
# signals win ties. Also usable on their own: domain + order_signals is
# enough to match even without an intent-list phrase.
order_signals:
  - "под ключ"
  - "разовая задача"
  - "разовый проект"
  - "разовый заказ"
  - "нужно сделать"
  - "нужно разработать"
  - "требуется разработать"
  - "требуется доработать"
  - "доработать"
  - "переделать"
  - "редизайн"
  - "бюджет"
  - "оплата за проект"
  - "за проект"
  - "по тз"
  - "есть тз"
  - "пришлю тз"
  - "фикс"
  - "сдельно"
  - "напишите в лс"
  - "пишите в личку"
  - "в лс"
  - "ищу исполнителя"
  - "ищу фрилансера"
  - "ищу подрядчика"
  - "нужен фрилансер"
  - "нужен подрядчик"
  - "сделать сайт"
  - "нужен лендинг"
  - "нужен бот"
  - "оценить стоимость"
  - "сколько будет стоить"
  - "сколько стоит"
  - "прайс"
  - "коммерческое предложение"
  - "кп"
  - "срок разработки"
  - "сроки и стоимость"
