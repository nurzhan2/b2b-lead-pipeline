# Search keywords run against zakupki.gov.ru's public search, one search
# pass per keyword. Add/remove freely - no code changes needed.
#
# Собран по услугам двух сайтов студии:
#   qorsa.ru        - графический и веб-дизайн, сайты и интернет-магазины,
#                     мобильные приложения
#   malevich2.com   - AI-ассистенты, RAG, чат-боты, автоматизация
#                     бизнес-процессов, сайты (Tilda/WordPress/Битрикс),
#                     Bitrix24 и CRM, интеграция с 1С, интернет-магазины,
#                     личные кабинеты, внутренние web-системы, UX/UI,
#                     фирменный стиль, мобильная разработка, SEO,
#                     техподдержка сайтов
#
# Раннер page-major (runner.py): страница 1 всех ключей, потом страница 2.
# Поэтому длина списка не съедает хвост при TARGET_PER_DAY - но помни, что
# каждый ключ это отдельный проход поиска, и время прогона растёт линейно.
#
# Счётчики в комментариях, где есть, получены реальными запросами к
# zakupki.gov.ru. Где счётчика нет - ключ добавлен по услуге и объём ещё
# не мерился.

keywords:

  # ---------- Сайты и веб-разработка ----------
  - "разработка сайта"
  - "создание сайта"
  - "разработка интернет-магазина"
  - "модернизация сайта"
  - "редизайн сайта"
  - "техническая поддержка сайта"
  - "сопровождение сайта"
  - "разработка корпоративного сайта"
  - "разработка официального сайта"

  # ---------- Мобильные приложения ----------
  - "разработка мобильного приложения"
  - "разработка приложения"

  # ---------- ПО, системы, личные кабинеты ----------
  - "разработка программного обеспечения"
  - "внедрение программного обеспечения"
  - "доработка информационной системы"
  - "разработка информационной системы"
  - "разработка личного кабинета"
  - "разработка веб-приложения"

  # ---------- Автоматизация, CRM, 1С, интеграции ----------
  - "автоматизация бизнес-процессов"
  - "внедрение crm"
  - "внедрение битрикс24"
  - "интеграция с 1с"
  - "доработка 1с"
  - "интеграция информационных систем"

  # ---------- AI, боты, данные ----------
  - "разработка чат-бота"
  - "внедрение искусственного интеллекта"
  - "система поддержки принятия решений"
  - "анализ данных"

  # ---------- Дизайн и бренд ----------
  - "разработка фирменного стиля"      # 973
  - "разработка логотипа"
  - "разработка дизайна сайта"
  - "графический дизайн"

  # ---------- Продвижение ----------
  - "seo продвижение"
  - "продвижение сайта"

  # ---------- Интерьер, среда, 3D ----------
  # Студия делает это наравне с digital. Счётчики - живые запросы
  # к zakupki.gov.ru.
  - "дизайн-проект"                  # ~11 000
  - "дизайн интерьера"               # ~1 500
  - "разработка дизайн-проекта"      # ~5 400
  - "оформление помещений"           # ~6 000
  - "изготовление и монтаж вывески"  # ~1 100
  - "ландшафтное проектирование"     # 219
  - "3D визуализация"                # 374

# ОТБРОШЕНО НАМЕРЕННО
#
# Слишком объёмные и не про нас - это стройка и инженерка, при таких
# объёмах они съедают весь TARGET_PER_DAY до того, как отработает
# релевантное:
#   "благоустройство территории"        ~250 000
#   "проектные работы"                  ~490 000
#   "разработка проектной документации" ~300 000
#
# ВНИМАНИЕ ПРО ОБЪЁМ. Ключей теперь 40, TARGET_PER_DAY по умолчанию 300.
# Раннер page-major, так что страница 1 каждого ключа отработает всегда,
# но до вторых-третьих страниц дело дойти не успеет: 40 ключей x 10
# результатов = 400 уже на первой странице. Если нужен охват вглубь -
# поднимай TARGET_PER_DAY в workers/zakupki/.env. Если вширь - оставь
# как есть, каждый прогон будет снимать свежий верх по всем ключам.
