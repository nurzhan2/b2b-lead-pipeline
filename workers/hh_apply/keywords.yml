# Под какие вакансии откликаться. Каждый запрос — это обычный поиск hh
# (https://hh.kz/search/vacancy?text=...&area=...), открытый в вашем окне.
#
# area — id региона hh строкой. Взято с https://api.hh.ru/areas/40 (Казахстан),
# проверено 2026-09-11: 160 — Алматы, 159 — Астана, 205 — Шымкент.
# Без area — поиск по всем регионам сайта.
#
# Язык запросов hh работает и здесь (https://hh.ru/article/1175): кавычки для
# точной фразы, OR, NOT.

queries:
  - text: "python разработчик"
    area: "160"
  - text: "junior python"
    area: "160"
  - text: "стажер python"
    area: "160"

# Если в НАЗВАНИИ вакансии есть одно из этих слов — вакансия не показывается
# вовсе (без учёта регистра). Не стоп hh, а ваш фильтр: в журнал не пишется,
# поменяли список — вакансия снова может появиться.
exclude_title_words:
  - senior
  - lead
  - ведущий
  - руководитель
